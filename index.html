<!doctype html>

    <meta name="theme-color" content="#F3F2EE" />

    <!--
      Fallback metadata. Each route replaces these through react-helmet-async;
      these are what a crawler or scraper sees before that runs, and what the
      previous version had none of.
    -->
    <title>LogicQR — Get more Google reviews from a QR code</title>
    <meta
      name="description"
      content="Put a QR code where your customers pay. They scan, rate, and the happy ones land on your Google review page. The rest reaches you privately so you can fix it."
    />
    <link rel="canonical" href="https://www.logicqr.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LogicQR" />
    <meta property="og:title" content="LogicQR — Get more Google reviews from a QR code" />

      property="og:description"
      content="Put a QR code where your customers pay. They scan, rate, and the happy ones land on your Google review page."

      sizes="32x32"

      gtag('config', 'G-R372C2PX6F', { anonymize_ip: true });

        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-R372C2PX6F';
